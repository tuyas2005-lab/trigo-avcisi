<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<meta name="robots" content="noindex">
<title>Rehber Takip · Uygulama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F6F5C'/%3E%3Cpath d='M18 44V20h16a8 8 0 0 1 0 16H18m16 0 10 8' fill='none' stroke='%23F6F3EC' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rehber Takip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<script defer src="/_vercel/insights/script.js"></script>
<style>
/* Rehber öğretmen öğrenci takip uygulaması. KVKK gereği öğrenci kayıtları yalnızca bu cihazda (localStorage) tutulur,
   sunucuya hiç gönderilmez. Sunucudan yalnızca ücretsiz sınır ve öğretmenin üyelik durumu okunur. */
:root{
  --bg:#F6F3EC; --panel:#FFFFFF; --panel2:#EFEAE0; --line:#E2DBCD;
  --fg:#1E2A2A; --muted:#5E6B69; --accent:#1F6F5C; --accent2:#E7F1EC; --warm:#E8833A; --warm2:#FCEBDD; --bad:#C2413A;
  --shadow:0 1px 2px rgba(30,42,42,.06),0 8px 24px rgba(30,42,42,.07);
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif; --body:'Nunito Sans','Segoe UI',Roboto,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141B1A; --panel:#1C2524; --panel2:#24302E; --line:#2F3C3A;
  --fg:#EEF2EF; --muted:#A3B1AE; --accent:#5FC3A5; --accent2:#1F3A33; --warm:#F2A361; --warm2:#3A2A1D; --bad:#F07C74;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0 0 .4em}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font:800 18px var(--display);color:var(--fg);text-decoration:none;margin-right:auto}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--bg);font-style:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;font:800 15px var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
main{padding:24px 0 80px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:var(--shadow)}
.plan .meter{flex:1;min-width:200px;font-weight:700;font-size:14px;color:var(--muted)}
.meter div{height:8px;border-radius:99px;background:var(--panel2);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar{display:flex;gap:10px;margin:20px 0 12px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px}
input,select,textarea{width:100%;font:16px var(--body);color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
.list{display:flex;flex-direction:column;gap:8px}
.stu{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.stu:hover{border-color:var(--accent)}
.stu b{display:block}.stu small{color:var(--muted);font-size:13px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.tag{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.tag.acik{background:var(--warm2);color:var(--warm)}.tag.izleniyor{background:var(--accent2);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:16px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,27,26,.55)}
.dlg{padding:24px;position:relative}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--panel2);color:var(--fg);font-size:17px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.notes li small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.msg{min-height:20px;margin:10px 0 0;font-weight:700;font-size:14px;color:var(--bad)}
.kvkk{display:flex;gap:10px;align-items:flex-start;background:var(--accent2);color:var(--fg);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.kvkk b{color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.center{max-width:420px;margin:60px auto;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100vw - 32px)}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../"><i>R</i>Rehber Takip</a><span id="who" style="font-weight:700;color:var(--muted);font-size:14px"></span><button class="btn ghost small" type="button" data-act="install" id="instBtn">📲 İndir</button></div></header>
<main><div class="wrap" id="app"></div></main>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script src="../config.js"></script>
<script src="../rg.js"></script>
<script>
const app=document.getElementById('app'),dlg=document.getElementById('dlg'),body=document.getElementById('dlgBody');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#1F6F5C','#E8833A','#6A5ACD','#2E86AB','#B5446E','#5C8001'];
const STATUS={acik:'Açık',izleniyor:'İzleniyor',kapandi:'Tamamlandı'};
const DB='rg-ogrenciler',LIM='rg-sinir';
let LIST=load(),ME=null,LIMIT=cachedLimit(),q='';
function load(){try{return JSON.parse(localStorage.getItem(DB))||[];}catch(e){return [];}}
function save(){try{localStorage.setItem(DB,JSON.stringify(LIST));return true;}catch(e){toast('Kaydedilemedi: tarayıcı depolaması dolu ya da kapalı.');return false;}}
/* Son bilinen sınır: internet yokken de aynı kural geçerli olsun. null = sınırsız. */
function cachedLimit(){try{const v=localStorage.getItem(LIM);return v===null?30:JSON.parse(v);}catch(e){return 30;}}
function setLimit(v){LIMIT=v;try{localStorage.setItem(LIM,JSON.stringify(v));}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function openDlg(h){body.innerHTML='<button class="x" type="button" data-act="close" aria-label="Kapat">✕</button>'+h;if(!dlg.open)dlg.showModal();}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
const color=id=>COLORS[parseInt(id.slice(0,2),16)%COLORS.length];
const today=()=>new Date().toLocaleDateString('sv-SE');
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+Math.random().toString(16).slice(2);
const full=()=>LIMIT!=null&&LIST.length>=LIMIT;

async function syncPlan(){
  if(!RG.online)return;
  try{
    if(RG.session()){ME=await RG.me();setLimit(ME.member?null:ME.limit);}
    else{const i=await RG.info();setLimit(i?i.free_limit:30);}
  }catch(e){if(e.message==='bad_token')ME=null;}
  render();}
function render(){
  document.getElementById('who').textContent=ME?ME.name:'';
  document.getElementById('instBtn').hidden=RG.installed();
  const pct=LIMIT?Math.min(100,LIST.length/LIMIT*100):100;
  const plan=ME&&ME.member?'Üyelik aktif':LIMIT==null?'Ücretsiz':'Ücretsiz hesap';
  const rows=LIST.filter(s=>!q||(s.data.ad+' '+(s.data.sinif||'')+' '+(s.data.konu||'')).toLocaleLowerCase('tr').includes(q));
  app.innerHTML='<div class="plan"><div class="meter">'+plan+' · '+LIST.length+(LIMIT?' / '+LIMIT:'')+' öğrenci<div><i style="width:'+pct+'%'+(full()?';background:var(--warm)':'')+'"></i></div></div>'+
    (LIMIT==null?'':'<a class="btn warm small" href="../#uye-ol">Sınırı kaldır</a>')+'</div>'+
    '<div class="kvkk"><span>🔒</span><span><b>Kayıtlarınız bu cihazda.</b> KVKK kapsamında öğrenci bilgileri yalnızca kendi bilgisayarınızda/telefonunuzda saklanır, sunucumuza gönderilmez. Başka cihazda görünmez; düzenli yedek alın.</span></div>'+
    '<div class="bar"><input type="search" id="q" placeholder="Öğrenci, sınıf ya da konu ara" value="'+esc(q)+'" aria-label="Ara"><button class="btn primary" type="button" data-act="new">+ Öğrenci ekle</button></div>'+
    (LIST.length?'<div class="list">'+rows.map(s=>'<button class="stu" type="button" data-id="'+s.id+'"><span class="av" style="background:'+color(s.id)+'">'+esc(initials(s.data.ad||'?'))+'</span><span><b>'+esc(s.data.ad)+'</b><small>'+esc([s.data.sinif,s.data.konu].filter(Boolean).join(' · '))+((s.data.notlar||[]).length?' · '+s.data.notlar.length+' görüşme':'')+'</small></span><span class="tag '+esc(s.data.durum||'')+'">'+(STATUS[s.data.durum]||'')+'</span></button>').join('')+(rows.length?'':'<p style="color:var(--muted)">Aramaya uyan öğrenci yok.</p>')+'</div>'
     :'<div class="empty"><h3>İlk öğrencinizi ekleyin</h3><p>'+(LIMIT==null?'Öğrenci sınırı yok.':'Ücretsiz olarak '+LIMIT+' öğrenciye kadar kayıt yapabilirsiniz.')+'</p></div>')+
    '<div class="tools"><button class="btn ghost small" type="button" data-act="backup">⬇ Yedek al</button><button class="btn ghost small" type="button" data-act="restore">⬆ Yedekten yükle</button>'+(ME?'':'<a class="btn ghost small" href="../">Hesap / giriş</a>')+'</div>';
  const qi=document.getElementById('q');qi.addEventListener('input',()=>{q=qi.value.toLocaleLowerCase('tr');const p=qi.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);});}
function limitView(){openDlg('<h2>'+LIMIT+' öğrenci sınırına ulaştınız</h2><p>Ücretsiz kullanımda en fazla '+LIMIT+' öğrenci kaydedilebilir. Mevcut kayıtlarınız olduğu gibi duruyor. Daha fazla öğrenci için üye olun ya da artık takip etmediğiniz bir öğrenciyi silin.</p><a class="btn warm" href="../#uye-ol">Üye ol</a>');}
function studentForm(s){
  const d=s?s.data:{ad:'',sinif:'',konu:'',durum:'acik',notlar:[]};
  openDlg('<h2>'+(s?esc(d.ad):'Yeni öğrenci')+'</h2><form id="sForm" data-id="'+(s?s.id:'')+'">'+
  '<label for="sAd">Ad soyad</label><input id="sAd" required maxlength="60" value="'+esc(d.ad)+'" placeholder="Örn. Ayşe K.">'+
  '<div class="row"><div><label for="sSinif">Sınıf</label><input id="sSinif" maxlength="20" value="'+esc(d.sinif)+'" placeholder="8-B"></div><div><label for="sDurum">Durum</label><select id="sDurum">'+Object.keys(STATUS).map(k=>'<option value="'+k+'"'+(d.durum===k?' selected':'')+'>'+STATUS[k]+'</option>').join('')+'</select></div></div>'+
  '<label for="sKonu">Takip konusu</label><input id="sKonu" maxlength="80" value="'+esc(d.konu)+'" placeholder="Örn. Sınav kaygısı">'+
  (s?'<label for="sNot">Yeni görüşme notu</label><textarea id="sNot" maxlength="2000" placeholder="Bugünkü görüşmede…"></textarea>'+
     ((d.notlar||[]).length?'<ul class="notes">'+d.notlar.slice().reverse().map(n=>'<li><small>'+fmt(n.t)+'</small>'+esc(n.m)+'</li>').join('')+'</ul>':''):'')+
  '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn primary" type="submit">Kaydet</button>'+(s?'<button class="btn danger" type="button" data-act="del">Sil</button>':'')+'</div><p class="msg" id="sMsg" role="alert"></p></form>');
  setTimeout(()=>document.getElementById(s?'sNot':'sAd').focus(),50);}
function backup(){
  const blob=new Blob([JSON.stringify({uygulama:'rehber-takip',surum:1,tarih:new Date().toISOString(),ogrenciler:LIST},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rehber-takip-yedek-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Yedek indirildi. Dosyayı güvenli bir yerde saklayın.');}
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());const arr=j&&Array.isArray(j.ogrenciler)?j.ogrenciler:null;
    if(!arr||!arr.every(x=>x&&typeof x.id==='string'&&x.data&&typeof x.data.ad==='string'))throw 0;
    openDlg('<h2>Yedekten yükle</h2><p>Yedekte <b>'+arr.length+'</b> öğrenci var. Bu cihazdaki <b>'+LIST.length+'</b> kaydın yerini alacak.</p><button class="btn primary" type="button" data-act="doRestore">Yükle</button>');
    pending=arr;}catch(err){toast('Bu dosya bir Rehber Takip yedeği değil.');}});
let pending=null;
document.addEventListener('click',async e=>{
  const st=e.target.closest('.stu');if(st){studentForm(LIST.find(x=>x.id===st.dataset.id));return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close')dlg.close();
  else if(a==='new'){if(full())limitView();else studentForm(null);}
  else if(a==='backup')backup();
  else if(a==='restore')document.getElementById('fileIn').click();
  else if(a==='doRestore'&&pending){LIST=pending;pending=null;save();dlg.close();render();toast('Yedek yüklendi.');}
  else if(a==='install'){if(await RG.install())toast('Uygulama yükleniyor…');else location.href='../#indir';}
  else if(a==='del'){
    if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Emin misiniz? Tüm notları silinir';return;}
    const id=document.getElementById('sForm').dataset.id;LIST=LIST.filter(x=>x.id!==id);save();dlg.close();render();toast('Öğrenci silindi.');}
});
document.addEventListener('submit',e=>{
  e.preventDefault();if(e.target.id!=='sForm')return;
  const f=e.target,id=f.dataset.id||null,old=id?LIST.find(x=>x.id===id):null,m=document.getElementById('sMsg');
  const ad=document.getElementById('sAd').value.trim();if(ad.length<2){m.textContent='Öğrencinin adını yazın.';return;}
  if(!id&&full()){limitView();return;}
  const data={ad,sinif:document.getElementById('sSinif').value.trim(),konu:document.getElementById('sKonu').value.trim(),durum:document.getElementById('sDurum').value,notlar:(old?old.data.notlar||[]:[]).slice()};
  const n=id&&document.getElementById('sNot').value.trim();if(n)data.notlar.push({t:today(),m:n});
  if(old)old.data=data;else LIST.push({id:uid(),data,created:today()});
  if(save()){dlg.close();render();toast(id?'Kaydedildi.':'Öğrenci eklendi.');}
});
addEventListener('storage',e=>{if(e.key===DB){LIST=load();render();}});
render();syncPlan();
</script>
</body>
</html>
