<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dönem Sonu Faaliyet Raporu</title>
<style>
@font-face{font-family:"Nunito Sans";font-weight:200 1000;src:url(assets/font/nunito-sans-latin-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito Sans";font-weight:200 1000;src:url(assets/font/nunito-sans-latin-ext-wght-normal.woff2) format("woff2-variations");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--l:#1c3557;--t:#0e7490;--c:#d5dde7;--s:#5d6a7c}
*{box-sizing:border-box}
body{margin:0;background:#e9eef3;color:#1a2433;font:13.5px/1.55 "Nunito Sans","Segoe UI",Tahoma,sans-serif}
.arac{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;background:#1c3557;color:#fff}
.arac button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;background:#fff;color:#1c3557}
.arac button.ana{background:#0e7490;color:#fff}
.arac span{font-size:13px;opacity:.85}
.sayfa{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:18mm 16mm 16mm;box-shadow:0 8px 30px rgba(20,35,60,.15);position:relative}
.kapak{display:flex;flex-direction:column;justify-content:space-between}
.kapak .ust{text-align:center;color:var(--s);font-weight:700;letter-spacing:.5px}
.kapak .ust b{display:block;font-size:13px;color:#1a2433}
.kapak .orta{text-align:center;margin-top:40mm}
.kapak .orta.logolu{margin-top:14mm}
.kapak .kapak-logo{display:block;width:52mm;height:52mm;object-fit:contain;margin:0 auto 12mm}
.kapak .orta .serit{width:70px;height:6px;border-radius:6px;background:linear-gradient(90deg,#1c3557,#0e7490);margin:0 auto 18px}
.kapak h1{font-size:28px;line-height:1.25;margin:0 0 10px;color:var(--l)}
.kapak .yil{font-size:17px;font-weight:700;color:var(--t)}
.kapak .donem{margin-top:6px;color:var(--s)}
.kapak .alt{display:flex;justify-content:space-between;border-top:2px solid var(--c);padding-top:14px;font-size:13px}
.kapak .alt b{display:block;font-size:14px}
h2{font-size:16px;color:var(--l);margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--c);break-after:avoid}
h2:first-child{margin-top:0}
h2 .no{color:var(--t);margin-right:6px}
p.aciklama{color:var(--s);margin:4px 0 10px;font-size:12.5px}
table{width:100%;border-collapse:collapse;margin:6px 0 4px;break-inside:auto}
th{background:#f1f5f9;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#475569;padding:6px 8px;border:1px solid var(--c)}
td{padding:6px 8px;border:1px solid var(--c);vertical-align:middle}
td.s,th.s{text-align:center}td.r,th.r{text-align:right}
tr{break-inside:avoid}
tr.toplam td{font-weight:800;background:#f8fafc}
.ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.ozet div{border:1px solid var(--c);border-radius:10px;padding:8px 10px}
.ozet b{display:block;font-size:22px;color:var(--l);line-height:1.2}
.ozet span{font-size:11.5px;color:var(--s)}
.cubuk{display:inline-block;height:8px;border-radius:6px;background:#0e7490;vertical-align:middle;margin-right:6px}
.degerlendirme{min-height:60mm;border:1px dashed #9fb0c5;border-radius:10px;padding:10px 12px;white-space:pre-wrap;outline:none}
.degerlendirme:empty::before{content:attr(data-ipucu);color:#94a3b8}
.imzalar{display:flex;justify-content:space-between;margin-top:24mm;text-align:center;break-inside:avoid}
.imzalar>div{width:40%;display:flex;flex-direction:column;align-items:center}
.imzalar .cizgi{width:80%;border-top:1px solid #1a2433;margin:0 auto 6px}
.imzalar b{min-height:1.45em;line-height:1.45}
.imzalar span{line-height:1.45}
.dipnot{font-size:11px;color:var(--s);margin-top:14px}
.bos{color:var(--s);font-style:italic}
/* ===== Renkli / 3B görünüm (sürüm 2.2) — bölüm rengi .bolum üzerindeki --hr değişkeninden gelir ===== */
:root{--r1:#2563eb;--r2:#0e9f8e;--r3:#f59e0b;--r4:#8b5cf6;--r5:#e11d48;--r6:#0891b2;--r7:#16a34a;--r8:#ea580c;--r9:#475569}
/* kapak */
.kapak{overflow:hidden}

.kapak::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9mm;
  background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5))}
.kapak .ust{position:relative;color:#d6e6fb!important;margin:-18mm -16mm 0;padding:11mm 16mm 10mm;line-height:1.7;
  background:linear-gradient(120deg,#1c3557 0%,#1f5fa8 55%,#0e9f8e 100%);overflow:hidden}
.kapak .ust::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.kapak .ust::before{content:"";position:absolute;left:-40px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
@media print{.kapak .ust{margin:0;border-radius:16px;padding:9mm 10mm}}
.kapak .ust b{color:#fff!important}
.kapak .orta .serit{width:120px;height:8px;background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3))}
.kapak h1{color:#1c3557;font-size:30px}
.kapak .yil{display:inline-block;margin-top:6px;padding:6px 18px;border-radius:30px;color:#fff;
  background:linear-gradient(135deg,#0e9f8e,#2563eb);box-shadow:0 4px 0 #1b4f9c,0 10px 18px -6px rgba(30,80,160,.5)}
.kapak .kapak-logo{filter:drop-shadow(0 10px 14px rgba(20,35,60,.25))}
.kapak .alt{position:relative;z-index:1;border-top:0;margin-bottom:12mm;gap:14px}
.kapak .alt>div{flex:1;background:#f4f8fd;border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 #d3dfee,0 8px 16px -8px rgba(20,35,60,.25)}
/* bölüm başlıkları: numaralı renkli rozet */
h2{border-bottom:0!important;display:flex;align-items:center;gap:10px;font-size:16.5px!important;margin:26px 0 10px!important;
  padding:7px 18px 7px 8px!important;border-radius:40px;width:fit-content;max-width:100%;
  background:linear-gradient(135deg,var(--hr,#2563eb),color-mix(in srgb,var(--hr,#2563eb) 70%,#fff));color:#fff!important;
  box-shadow:0 4px 0 color-mix(in srgb,var(--hr,#2563eb) 65%,#000),0 10px 18px -8px color-mix(in srgb,var(--hr,#2563eb) 70%,transparent);break-after:avoid;page-break-after:avoid}
h2 .no{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  background:#fff;color:var(--hr,#2563eb)!important;font-weight:900;margin:0!important;box-shadow:0 2px 0 rgba(0,0,0,.15)}
h2{text-shadow:0 1px 1px rgba(0,0,0,.15)}
/* özet kartları: renkli 3B */
.ozet{gap:12px!important;margin:10px 0 18px!important}
.ozet div{border:0!important;border-radius:16px!important;padding:12px 14px!important;color:#fff;position:relative;overflow:hidden}
.ozet div::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.15)}
.ozet b{color:#fff!important;font-size:26px!important}
.ozet span{color:rgba(255,255,255,.9)!important;font-weight:700}
.ozet div:nth-child(1){background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 5px 0 #1e3a8a,0 12px 20px -8px rgba(29,78,216,.6)}
.ozet div:nth-child(2){background:linear-gradient(135deg,#14b8a6,#0f766e);box-shadow:0 5px 0 #115e59,0 12px 20px -8px rgba(15,118,110,.6)}
.ozet div:nth-child(3){background:linear-gradient(135deg,#fbbf24,#d97706);box-shadow:0 5px 0 #92400e,0 12px 20px -8px rgba(217,119,6,.6)}
.ozet div:nth-child(4){background:linear-gradient(135deg,#a78bfa,#6d28d9);box-shadow:0 5px 0 #4c1d95,0 12px 20px -8px rgba(109,40,217,.6)}
/* tablolar: yuvarlak köşeli, kabartmalı, başlık bölüm renginde */
table{border-collapse:separate!important;border-spacing:0;border-radius:14px;overflow:hidden;margin:8px 0 10px!important;
  box-shadow:0 4px 0 #d3dce8,0 12px 22px -10px rgba(20,35,60,.35);border:1px solid #dbe3ee}
th{border:0!important;color:#fff!important;font-weight:800;padding:9px 10px!important;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tr,#2563eb) 88%,#fff),var(--tr,#2563eb))!important}
td{border:0!important;border-top:1px solid #e8eef5!important;padding:7px 10px!important}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tr,#2563eb) 6%,#fff)}
tr.toplam td{background:color-mix(in srgb,var(--tr,#2563eb) 16%,#fff)!important;color:#0f1d33;border-top:2px solid color-mix(in srgb,var(--tr,#2563eb) 45%,#fff)!important}
.cubuk{height:10px!important;border-radius:10px!important;background:linear-gradient(90deg,color-mix(in srgb,var(--tr,#2563eb) 55%,#fff),var(--tr,#2563eb))!important;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
p.aciklama{background:#f6f8fb;border-left:3px solid #cbd5e1;padding:5px 10px;border-radius:0 8px 8px 0}
.degerlendirme{border:0!important;background:linear-gradient(180deg,#fbfcfe,#f1f5fb);border-radius:14px!important;
  box-shadow:inset 0 2px 6px rgba(20,35,60,.08),0 4px 0 #d3dce8}
.imzalar .cizgi{border-top:2px solid #1c3557!important}
.bolum{--tr:var(--hr);break-inside:avoid;page-break-inside:avoid}
.bolum.uzun{break-inside:auto;page-break-inside:auto}
.kapsama-rozet{display:inline-block;min-width:46px;padding:2px 8px;border-radius:20px;font-weight:800;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.kapsama-rozet.iyi{background:linear-gradient(135deg,#22c55e,#15803d)}
.kapsama-rozet.orta{background:linear-gradient(135deg,#fbbf24,#d97706)}
.kapsama-rozet.dusuk{background:linear-gradient(135deg,#f87171,#b91c1c)}
@page{size:A4;margin:14mm 13mm 14mm}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .arac{display:none}
  .sayfa{margin:0;box-shadow:none;width:auto;min-height:auto;padding:0;page-break-after:always}
  .sayfa:last-child{page-break-after:auto}
  .kapak{height:268mm}
  .degerlendirme{border-color:#cbd5e1}
  .degerlendirme:empty::before{content:""}
}
</style>
</head>
<body>
<div class="arac">
  <button class="ana" id="yazdirBtn">Yazdır / PDF olarak kaydet</button>
  <button id="kapatBtn">Kapat</button>
  <span>İpucu: "Genel Değerlendirme" bölümüne tıklayıp yazabilirsiniz; yazdığınız bu bilgisayarda hatırlanır.</span>
</div>
<div id="rapor"><div class="sayfa"><p class="bos">Rapor hazırlanıyor…</p></div></div>

<script src="ortak.js"></script>
<script>
var q = new URLSearchParams(location.search);
document.getElementById("yazdirBtn").addEventListener("click", function () { window.print(); });
document.getElementById("kapatBtn").addEventListener("click", function () { window.close(); if (!window.closed) history.back(); });

function yuzde(a, b) { return b ? Math.round(1000 * a / b) / 10 : 0; }
function e(s) { return kacHTML(s); }
function tablo(basliklar, satirlar, toplam) {
  if (!satirlar.length) return '<p class="bos">Bu dönemde kayıt yok.</p>';
  return '<table><thead><tr>' + basliklar.map(function (b) { return '<th class="' + (b[1] || "") + '">' + e(b[0]) + '</th>'; }).join("") +
    '</tr></thead><tbody>' + satirlar.map(function (s) {
      return '<tr>' + s.map(function (h, i) { return '<td class="' + (basliklar[i][1] || "") + '">' + h + '</td>'; }).join("") + '</tr>';
    }).join("") + (toplam ? '<tr class="toplam">' + toplam.map(function (h, i) { return '<td class="' + (basliklar[i][1] || "") + '">' + h + '</td>'; }).join("") + '</tr>' : "") +
    '</tbody></table>';
}
function dagilimTablosu(liste, adBaslik, toplamPay) {
  var top = liste.reduce(function (a, x) { return a + x.sayi; }, 0);
  var enCok = liste.reduce(function (a, x) { return Math.max(a, x.sayi); }, 1);
  return tablo([[adBaslik], ["Sayı", "s"], ["Oran", "r"]], liste.map(function (x) {
    return [e(x.ad), gSayi(x.sayi), '<span class="cubuk" style="width:' + Math.round(60 * x.sayi / enCok) + 'px"></span>%' + yuzde(x.sayi, toplamPay || top)];
  }), [ "Toplam", gSayi(top), "" ]);
}
function egitimYili(t) {
  var p = String(t || "").split(".");
  if (p.length !== 3) return "";
  var y = +p[2], a = +p[1];
  return a >= 8 ? (y + "–" + (y + 1)) : ((y - 1) + "–" + y);
}
function kapsamaRozet(oran) {
  return '<span class="kapsama-rozet ' + (oran >= 70 ? "iyi" : oran >= 40 ? "orta" : "dusuk") + '">%' + oran + '</span>';
}
var BOLUM_RENKLERI = ["#2563eb", "#0e9f8e", "#f59e0b", "#8b5cf6", "#0891b2", "#e11d48", "#16a34a", "#ea580c", "#475569"];
/* içerik sayfasındaki her h2 + ardından gelenleri bir .bolum içine alır: başlık tablosuyla
   aynı sayfada kalsın (sayfa sonunda yalnız başlık kalmasın) ve bölüm rengini taşısın */
function bolumlereAyir(sayfa) {
  var cocuklar = Array.prototype.slice.call(sayfa.children), bolum = null, sira = 0;
  cocuklar.forEach(function (c) {
    if (c.tagName === "H2") {
      bolum = document.createElement("section");
      bolum.className = "bolum";
      bolum.style.setProperty("--hr", BOLUM_RENKLERI[sira++ % BOLUM_RENKLERI.length]);
      sayfa.insertBefore(bolum, c);
    }
    if (bolum) bolum.appendChild(c);
  });
  sayfa.querySelectorAll(".bolum").forEach(function (b) { if (b.querySelectorAll("tbody tr").length > 18) b.classList.add("uzun"); });
}
function sure(dk) { var s = Math.floor(dk / 60), d = dk % 60; return dk ? (s ? s + " sa" : "") + (d ? " " + d + " dk" : "") : "—"; }

Promise.all([apiGet("/api/baslangic"), apiGet("/api/raporlar?" + q.toString())]).then(function (r) {
  var A = r[0].ayarlar || {}, v = r[1], od = v.oncekiDonem || {};
  var bas = v.donem.baslangic, bit = v.donem.bitis;
  var sinifFiltre = q.get("sinif");
  var bugun = new Date(), bugunMetin = ("0" + bugun.getDate()).slice(-2) + "." + ("0" + (bugun.getMonth() + 1)).slice(-2) + "." + bugun.getFullYear();
  var h = "";

  /* ---- kapak ---- */
  h += '<div class="sayfa kapak"><div class="ust"><b>T.C.</b>' + e(A.ilceIl || "") + '<br><b>' + e(A.okulAdi || "Okul adı (Ayarlar'dan girin)") + '</b>Rehberlik ve Psikolojik Danışma Servisi</div>' +
    '<div class="orta' + (r[0].logoSurum ? ' logolu' : '') + '">' + (r[0].logoSurum ? '<img class="kapak-logo" src="' + okulLogoUrl(r[0].logoSurum) + '" alt="Okul logosu">' : '') + '<div class="serit"></div><h1>Rehberlik ve Psikolojik Danışma<br>Hizmetleri Dönem Sonu Faaliyet Raporu</h1>' +
    '<div class="yil">' + e(egitimYili(bit)) + ' Eğitim-Öğretim Yılı</div>' +
    '<div class="donem">Rapor dönemi: ' + e(bas) + ' – ' + e(bit) + (sinifFiltre ? ' · Yalnızca ' + e(sinifFiltre) + ' sınıfı' : '') + '</div></div>' +
    '<div class="alt"><div>Hazırlayan<b>' + e(A.rehberAdSoyad || "") + '</b>' + e(A.unvan || "Rehber Öğretmen") + '</div>' +
    '<div style="text-align:right">Rapor tarihi<b>' + e(bugunMetin) + '</b></div></div></div>';

  /* ---- içerik ---- */
  h += '<div class="sayfa">';
  h += '<h2><span class="no">1.</span>Genel Özet</h2>';
  h += '<div class="ozet">' +
    '<div><b>' + gSayi(v.toplamGorusme) + '</b><span>Toplam görüşme</span></div>' +
    '<div><b>' + gSayi(v.ogrenciGorusme) + '</b><span>Öğrenci görüşmesi</span></div>' +
    '<div><b>' + gSayi(v.veliGorusme) + '</b><span>Veli görüşmesi</span></div>' +
    '<div><b>%' + v.kapsama.oran + '</b><span>Kapsama (' + gSayi(v.kapsama.gorusulenOgrenci) + '/' + gSayi(v.kapsama.toplamOgrenci) + ' öğrenci)</span></div></div>';
  h += tablo([["Gösterge"], ["Bu dönem", "s"], ["Önceki dönem*", "s"]], [
    ["Toplam görüşme", gSayi(v.toplamGorusme), gSayi(od.toplamGorusme)],
    ["Öğrenci görüşmesi", gSayi(v.ogrenciGorusme), gSayi(od.ogrenciGorusme)],
    ["Veli görüşmesi", gSayi(v.veliGorusme), gSayi(od.veliGorusme)],
    ["Kuruma yönlendirilen öğrenci", gSayi(v.yonlendirilenToplamOgrenci), "—"],
    ["Gerçekleştirilen sınıf etkinliği", gSayi(v.yapilanSinifEtkinligi), "—"],
    ["Yapılan toplantı", gSayi(v.toplantiRaporu.tamamlanan) + (v.toplantiRaporu.toplamDakika ? " (" + sure(v.toplantiRaporu.toplamDakika) + ")" : ""), "—"]
  ]);
  h += '<p class="aciklama">* Önceki dönem: aynı uzunluktaki bir önceki tarih aralığı (' + e(od.baslangic) + ' – ' + e(od.bitis) + ').</p>';

  h += '<h2><span class="no">2.</span>Görüşme Konuları</h2><p class="aciklama">Bir görüşmede birden fazla konu işaretlenebildiğinden toplam, görüşme sayısını aşabilir.</p>';
  h += dagilimTablosu(v.konuDagilimi.map(function (k) { return { ad: k.konu, sayi: k.sayi }; }), "Konu");

  h += '<h2><span class="no">3.</span>Başvuru Şekli (Öğrenci Görüşmeleri)</h2>';
  h += dagilimTablosu(v.basvuruDagilimi, "Başvuru şekli");
  h += '<h2><span class="no">4.</span>Yapılan Çalışma Türü (Öğrenci Görüşmeleri)</h2>';
  h += dagilimTablosu(v.calismaDagilimi, "Çalışma türü");

  h += '<h2><span class="no">5.</span>Sınıf Bazında Görüşme ve Kapsama</h2>';
  var sinifGorusme = {}; v.sinifDagilimi.forEach(function (s) { sinifGorusme[s.sinif] = s.sayi; });
  h += tablo([["Sınıf / Şube"], ["Kayıtlı öğrenci", "s"], ["Görüşülen öğrenci", "s"], ["Kapsama", "s"], ["Görüşme sayısı", "s"]],
    v.kapsama.siniflar.map(function (s) { return [e(s.sinif), gSayi(s.toplam), gSayi(s.gorusulen), kapsamaRozet(s.oran), gSayi(sinifGorusme[s.sinif] || 0)]; }),
    ["Toplam", gSayi(v.kapsama.toplamOgrenci), gSayi(v.kapsama.gorusulenOgrenci), kapsamaRozet(v.kapsama.oran), gSayi(v.toplamGorusme)]);

  h += '<h2><span class="no">6.</span>Kurumlara Yönlendirmeler</h2>';
  h += tablo([["Kurum"], ["Yönlendirme sayısı", "s"], ["Öğrenci sayısı", "s"]],
    v.kurumDagilimi.map(function (k) { return [e(k.kurum), gSayi(k.sayi), gSayi(k.ogrenciSayisi)]; }));

  h += '<h2><span class="no">7.</span>Gerçekleştirilen Sınıf Etkinlikleri</h2>';
  var em = v.sinifEtkinlikMatrisi || { siniflar: [], satirlar: [] };
  h += tablo([["Etkinlik"], ["Toplam", "s"]].concat(em.siniflar.map(function (s) { return [s, "s"]; })),
    em.satirlar.map(function (s) { return [e(s.etkinlikAdi), gSayi(s.toplam)].concat(em.siniflar.map(function (c) { return gSayi(s.sayilar[c] || 0); })); }));

  h += '<h2><span class="no">8.</span>Yapılan Toplantılar</h2>';
  var tr = v.toplantiRaporu;
  h += tablo([["Toplantı türü"], ["Planlanan", "s"], ["Tamamlanan", "s"], ["Süre", "r"]],
    tr.turler.map(function (x) { return [e(x.tur), gSayi(x.adet), gSayi(x.tamamlanan), sure(x.dakika)]; }),
    tr.turler.length ? ["Toplam", gSayi(tr.toplamAdet), gSayi(tr.tamamlanan), sure(tr.toplamDakika)] : null);

  var anahtar = "faaliyetDegerlendirme:" + bas + ":" + bit + ":" + (sinifFiltre || "");
  var kayitli = "";
  try { kayitli = localStorage.getItem(anahtar) || ""; } catch (x) {}
  h += '<h2><span class="no">9.</span>Genel Değerlendirme ve Öneriler</h2>' +
    '<div class="degerlendirme" id="degerlendirme" contenteditable="true" data-ipucu="Dönem boyunca öne çıkan ihtiyaçlar, yapılan çalışmaların etkisi ve gelecek dönem için öneriler… (buraya tıklayıp yazın)">' + e(kayitli) + '</div>';

  h += '<div class="imzalar"><div><div class="cizgi"></div><b>' + e(A.rehberAdSoyad || "") + '</b><span>' + e(A.unvan || "Rehber Öğretmen") + '</span></div>' +
    '<div><div class="cizgi"></div><b>&nbsp;</b><span>Okul Müdürü</span></div></div>';
  h += '<p class="dipnot">Bu rapor yalnızca toplu (sayısal) bilgiler içerir; öğrenci adı veya görüşme içeriği yer almaz (6698 sayılı KVKK). ' +
    'Öğrenci Rehberlik Takip Sistemi ile ' + e(bugunMetin) + ' tarihinde oluşturulmuştur.</p>';
  h += '</div>';

  document.getElementById("rapor").innerHTML = h;
  document.querySelectorAll("#rapor .sayfa:not(.kapak)").forEach(bolumlereAyir);
  document.title = "Faaliyet Raporu " + bas + " – " + bit;
  var d = document.getElementById("degerlendirme");
  d.addEventListener("input", function () { try { localStorage.setItem(anahtar, d.innerText); } catch (x) {} });
}).catch(function (err) {
  document.getElementById("rapor").innerHTML = '<div class="sayfa"><p class="bos">Rapor oluşturulamadı: ' + kacHTML(err.message) + '</p></div>';
});
</script>
</body>
</html>
