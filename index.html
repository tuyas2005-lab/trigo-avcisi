<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trigo Avcısı">
<meta name="description" content="10. sınıf trigonometri: dersler, testler, laboratuvar ve karaoke şarkı.">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trigo Avcısı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: tek sütun telefon uygulaması — üstte durum çubuğu, ortada ekran, altta sabit menü. Infografikle aynı renk kodu: sin kırmızı, cos mavi, tan mor, cot turuncu. */
:root{
  --bg:#0F1B2D; --panel:#17263D; --panel2:#1F3250; --line:#2B3E5C;
  --fg:#F4F1EA; --muted:#A9B6C9; --ink:#0F1B2D; --dim:#5B6C88;
  --sin:#FF5A5F; --cos:#2EC4F1; --tan:#B98CFF; --cot:#FFA53D; --ok:#5BE49B; --bad:#FF5A5F;
  --sin-d:#B33A3E; --cos-d:#1A86A8; --tan-d:#7A55C2; --cot-d:#B86A10; --ok-d:#2E9E62;
  --face:#21355A; --face2:#182A47; --edge:#0A1426; --hl:rgba(255,255,255,.09);
  --display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --body:'Nunito Sans', 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--cos);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
b{font-weight:800}
.c-sin{color:var(--sin)}.c-cos{color:var(--cos)}.c-tan{color:var(--tan)}.c-cot{color:var(--cot)}.c-ok{color:var(--ok)}.muted{color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px}
.frac>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px 2px}
.frac>span:last-child{padding:2px 4px 0}
.ico{width:20px;height:20px;flex-shrink:0}

/* üst bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}

/* profil kartı */
.hero{background:var(--panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h1{font-size:34px}
.hero .lvl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sin),var(--cot));transition:width .5s}
.quad{position:absolute;right:-14px;top:-14px;display:grid;grid-template-columns:repeat(2,34px);gap:5px;transform:rotate(12deg);opacity:.9}
.quad span{height:34px;border-radius:9px}

/* harita */
.map{display:flex;flex-direction:column;gap:14px;position:relative}
.node{display:flex;gap:14px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:14px;text-align:left;width:100%;position:relative;transition:transform .15s}
.node:active{transform:scale(.98)}
.node .num{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);flex-shrink:0}
.node .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.node .txt strong{font-family:var(--display);font-size:21px}
.node .txt small{color:var(--muted);font-size:14px;font-weight:600}
.node .stars{display:flex;gap:2px}
.node.locked{opacity:.45}
.node.boss{border-color:var(--cot);background:linear-gradient(135deg,#2A1E2C,#261F3D)}
.node.next{border-color:var(--ok);box-shadow:0 0 0 4px rgba(91,228,155,.15)}
.badge-next{position:absolute;top:-10px;right:14px;background:var(--ok);color:var(--ink);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;letter-spacing:.06em}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,27,45,.96);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:5}
.nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:13px;font-weight:800;color:var(--muted);min-height:58px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .ico{color:var(--cot)}

/* ders */
.lessonTop{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.dots i.on{background:var(--fg)}
.slide{background:var(--panel);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;min-height:420px}
.slide h2{font-size:30px}
.slide p{font-size:18px;line-height:1.55}
.tri{width:100%;max-height:250px;display:block;overflow:visible}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .tri{max-height:170px}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.25}
.rule{border-radius:18px;padding:16px 18px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px}
.rule .tag{background:var(--ink);border-radius:10px;padding:4px 12px;font-size:20px}
.tip{border:2px dashed var(--ok);border-radius:16px;padding:12px 14px;color:var(--ok);font-weight:700;font-size:16px}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:56px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:20px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ok);color:var(--ink);box-shadow:0 5px 0 #2E9E62}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #2E9E62}
.btn.ghost{background:var(--panel);border:2px solid var(--line)}
.btn.warm{background:var(--cot);color:var(--ink);box-shadow:0 5px 0 #B86A10}

/* test */
.qTop{display:flex;align-items:center;gap:12px}
.qbar{flex:1;height:14px;border-radius:999px;background:var(--panel);overflow:hidden}
.qbar>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .35s}
.hearts{display:flex;gap:2px;color:var(--sin)}
.combo{font-family:var(--display);font-weight:800;color:var(--cot);display:flex;align-items:center;gap:4px;min-height:24px}
.qcard{background:var(--panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qcard .prompt{font-size:20px;font-weight:700;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:72px;border-radius:18px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.long{font-size:17px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:var(--ink);box-shadow:0 4px 0 #2E9E62}
.opt.bad{background:var(--bad);border-color:var(--bad);color:var(--ink);box-shadow:0 4px 0 #B33A3E}
.opt[disabled]{cursor:default}
.taphint{text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.hit{cursor:pointer}
.feedback{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .25s ease-out}
.feedback.good{background:#173B30;border:2px solid var(--ok)}
.feedback.wrong{background:#3A1C24;border:2px solid var(--bad)}
.feedback h3{font-size:26px;display:flex;align-items:center;gap:8px}
.feedback.good h3{color:var(--ok)}.feedback.wrong h3{color:var(--sin)}
.feedback p{font-size:17px}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* sonuç */
.result{background:var(--panel);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.result h2{font-size:36px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:58px;height:58px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{background:var(--bg);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:700;font-size:13px}

/* lab */
.lab{background:var(--panel);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.slider{width:100%;accent-color:var(--cot);height:36px}
.vals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.val{border-radius:16px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.val .k{font-family:var(--display);font-weight:800;font-size:18px}
.val .v{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.val .mini{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.val .mini i{display:block;height:100%;border-radius:999px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:800}
.exact{background:var(--ok);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:800}

/* kopya kâğıdı */
.sheet{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:22px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:separate;border-spacing:4px;width:100%;font-family:var(--display);font-weight:700;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.tbl th{color:var(--muted);font-weight:700;padding:6px}
.tbl td{background:var(--bg);border-radius:8px;padding:8px 4px;white-space:nowrap}
.tbl td.h{color:var(--ink);font-weight:800}
.tbl td.s{font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.three div{background:var(--bg);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.three b{font-family:var(--display);font-size:17px}
.three small{color:var(--muted);font-size:13px;font-weight:700}
.danger{color:var(--sin);border:2px solid var(--line);border-radius:14px;min-height:48px;font-weight:800}

/* hoş geldin */
.welcome{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.welcome h1{font-size:54px;letter-spacing:-1px}
.welcome label{font-weight:800}
.welcome input{width:100%;min-height:58px;border-radius:16px;border:3px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:20px;font-weight:700;padding:0 16px}
.logoQuad{display:grid;grid-template-columns:repeat(2,64px);gap:8px}
.logoQuad span{height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)}

/* ritim modu */
.karaoke{background:var(--panel);border-radius:24px;padding:22px;min-height:270px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.sec{align-self:flex-start;font-size:13px;font-weight:800;letter-spacing:.08em;padding:4px 12px;border-radius:999px;background:var(--bg);color:var(--cot)}
.cur{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.25;display:flex;flex-wrap:wrap;gap:2px 10px;min-height:80px;text-wrap:balance}
.cur .w{color:var(--dim);transition:color .1s,transform .1s;display:inline-block}
.cur .w.on{color:var(--fg)}
.cur .w.on.k-sin{color:var(--sin)}.cur .w.on.k-cos{color:var(--cos)}.cur .w.on.k-tan{color:var(--tan)}.cur .w.on.k-cot{color:var(--cot)}
.cur .w.now{transform:translateY(-4px) scale(1.06)}
.nxt{color:var(--muted);font-size:18px;font-weight:700;min-height:27px}
.beats{display:flex;gap:10px}
.beats i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:background .05s}
.beats i.on{background:var(--cot)}.beats i.on.one{background:var(--ok)}
.player{display:flex;align-items:center;gap:16px}
.play{width:84px;height:84px;border-radius:50%;background:var(--ok);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 0 #2E9E62;flex-shrink:0}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #2E9E62}
.play svg{width:38px;height:38px}
.player .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.songbar{height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.songbar i{display:block;height:100%;background:var(--cot);width:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--panel);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.seg button[disabled]{opacity:.5;cursor:default}
.lyr h4{margin:0;font-size:13px;letter-spacing:.08em;color:var(--cot)}
.lyr p{font-size:17px;line-height:1.55}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
/* ===== 3D katman ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 15% 0%,rgba(46,196,241,.16),transparent 70%),radial-gradient(50% 35% at 100% 10%,rgba(185,140,255,.16),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(255,165,61,.10),transparent 70%)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(46,196,241,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(46,196,241,.35) 1px,transparent 1px);background-size:56px 56px;transform:perspective(320px) rotateX(62deg);transform-origin:50% 100%;opacity:.16;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 90%);mask-image:linear-gradient(to top,#000 10%,transparent 90%)}
.hero,.node,.slide,.qcard,.box,.karaoke,.lab,.result{background:linear-gradient(180deg,var(--face),var(--face2));border:1px solid var(--line);border-top-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 var(--hl),0 7px 0 var(--edge),0 16px 28px rgba(0,0,0,.4)}
.node{transition:transform .12s,box-shadow .12s}
.node:active{transform:translateY(5px);box-shadow:inset 0 1px 0 var(--hl),0 2px 0 var(--edge),0 6px 12px rgba(0,0,0,.35)}
.node.next{border-color:var(--ok);box-shadow:inset 0 1px 0 var(--hl),0 7px 0 var(--ok-d),0 16px 28px rgba(0,0,0,.4),0 0 24px rgba(91,228,155,.25);animation:bob 2.6s ease-in-out infinite}
.node.boss{background:linear-gradient(180deg,#3A2742,#241E3D);box-shadow:inset 0 1px 0 var(--hl),0 7px 0 #5A3B12,0 16px 28px rgba(0,0,0,.4)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node .num{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 var(--nd,var(--edge));transform:translateY(-2px)}
.val,.stat,.three div,.tbl td{box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.opt{background:linear-gradient(180deg,#2A4370,#1F3250);border-color:#35507F;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 0 #0E1A30;transform:translateY(0)}
.opt:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 #0E1A30}
.opt.ok{background:linear-gradient(180deg,#7CEDB2,var(--ok));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 0 var(--ok-d)}
.opt.bad{background:linear-gradient(180deg,#FF8286,var(--bad));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 0 var(--sin-d)}
.btn.primary{background:linear-gradient(180deg,#7CEDB2,var(--ok));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 0 var(--ok-d),0 10px 18px rgba(0,0,0,.35)}
.btn.warm{background:linear-gradient(180deg,#FFBE6E,var(--cot));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 0 var(--cot-d),0 10px 18px rgba(0,0,0,.35)}
.btn.ghost{background:linear-gradient(180deg,var(--face),var(--face2));box-shadow:inset 0 1px 0 var(--hl),0 5px 0 var(--edge)}
.btn:active{transform:translateY(4px)}
.iconbtn,.chip{background:linear-gradient(180deg,var(--face),var(--face2));box-shadow:inset 0 1px 0 var(--hl),0 4px 0 var(--edge)}
.play{background:radial-gradient(circle at 35% 30%,#A6F5CB,var(--ok) 60%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 7px 0 var(--ok-d),0 14px 24px rgba(0,0,0,.4)}
.rule{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 rgba(0,0,0,.35);background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%)}
.tri{filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(46,196,241,.12))}
.nav{background:linear-gradient(180deg,rgba(33,53,90,.92),rgba(15,27,45,.97));border-top:1px solid rgba(255,255,255,.12);box-shadow:0 -8px 24px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav button[aria-current="page"] .ico{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 3px 0 var(--cot-d))}
.nav .ico{transition:transform .15s}
.bar,.qbar,.songbar{box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar>i{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(90deg,var(--sin),var(--cot))}
.qbar>i{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.bigstars svg{filter:drop-shadow(0 5px 0 var(--cot-d));animation:pop .5s ease-out both}
.bigstars svg:nth-child(2){animation-delay:.12s}.bigstars svg:nth-child(3){animation-delay:.24s}
/* dönen küp */
.cube3d{--s:84px;width:var(--s);height:var(--s);perspective:520px;flex-shrink:0}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-32deg);animation:spin 12s linear infinite}
.cube span{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.3);color:var(--ink);box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),inset 0 -8px 16px rgba(0,0,0,.18);background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%)}

// v: dikey dik kenar, h: yatay dik kenar, at: α'nın köşesi ('A' üst, 'B' sağ), rot: 90° dönüş sayısı, flip: aynala

  const inp=document.getElementById('labAngle');inp.addEventListener('input',()=>labUpdate(LAB_ANG[+inp.value]));labUpdate(30);
}
const LAB_ANG=[30,45,60];
const LAB_NOTE={30:'30°-60°-90° üçgeni: kenarlar 1 – √3 – 2. Hipotenüsü 1’e indirince kenarlar 1/2 – √3/2 – 1 olur.',45:'45°-45°-90° üçgeni: kenarlar 1 – 1 – √2. Hipotenüsü 1’e indirince dik kenarlar √2/2 olur.',60:'30° ile 60° aynı üçgen! Sadece karşı ve komşu yer değiştirdi, o yüzden sin 60° = cos 30°.'};
function labUpdate(a){
  const r=a*Math.PI/180,s=Math.sin(r),c=Math.cos(r);
  const inp=document.getElementById('labAngle');if(inp)inp.value=String(LAB_ANG.indexOf(a));
  document.getElementById('labDeg').textContent=a+'°';
  document.getElementById('labTri').innerHTML=tri({v:s,h:c,at:'B',angle:a+'°',labels:{opp:'sin = '+TBL.sin[a],adj:'cos = '+TBL.cos[a],hyp:'1'},colors:{opp:'var(--sin)',adj:'var(--cos)',hyp:'var(--cot)'},pad:74});
  const vals=[['sin','var(--sin)',s,1],['cos','var(--cos)',c,1],['tan','var(--tan)',Math.tan(r),2],['cot','var(--cot)',1/Math.tan(r),2]];
  document.getElementById('labVals').innerHTML=vals.map(([k,col,v,mx])=>'<div class="val"><span class="k" style="color:'+col+'">'+k+' '+a+'°</span><span class="v">'+fmt(TBL[k][a])+'</span><span class="mini"><i style="width:'+Math.min(v/mx,1)*100+'%;background:'+col+'"></i></span></div>').join('');
  document.getElementById('labNote').innerHTML='<div class="exact">'+LAB_NOTE[a]+'</div>';
}

 {name:'GİRİŞ',type:'intro',lines:[{t:'Hazır mısın? Ritme gir…',bars:1},{t:'1 2 3 4',bars:1,on:[0,1,2,3]}]},
 {name:'NAKARAT',type:'chorus',lines:CHORUS},
 {name:'1. KITA',type:'verse',lines:V1.map(t=>({t,bars:2}))},
 {name:'NAKARAT',type:'chorus',lines:CHORUS},
 {name:'2. KITA',type:'verse',lines:V2.map(t=>({t,bars:2}))},
 {name:'NAKARAT',type:'chorus',lines:CHORUS},
 {name:'SON NAKARAT',type:'chorus',lines:CHORUS},
 {name:'FİNAL',type:'outro',lines:[{t:'Bravo! Artık sen bir Trigo Avcısısın!',bars:2}]}];
const LINES=[],BARS=[];
(function(){let bar=0;for(const s of SECTIONS){const s0=bar;for(const l of s.lines){const line=Object.assign({},l,{start:bar,sec:s.name,type:s.type,words:l.t.split(' ')});line.onsets=onsetsOf(line);LINES.push(line);for(let k=0;k<l.bars;k++){BARS.push({type:s.type,rel:bar-s0,line,first:k===0});bar++;}}}})();
function syl(w){const m=w.match(/[aeıioöuüAEIİOÖUÜ]/g);return m?m.length:1;}
function onsetsOf(l){if(l.on)return l.on;const s=l.words.map(syl);if(l.mel){let i=0;return s.map(n=>{const b=l.mel[Math.min(i,l.mel.length-1)][1];i+=n;return b;});}const tot=s.reduce((a,b)=>a+b,0),span=l.bars*4*.88;let acc=0;return s.map(n=>{const b=acc/tot*span;acc+=n;return b;});}
function wordKey(w){const x=w.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,'').toLowerCase();if(x==='sin'||x==='kahi')return 'k-sin';if(x==='cos'||x==='kohi')return 'k-cos';if(x==='tan'||x==='kako')return 'k-tan';if(x==='cot'||x==='koka')return 'k-cot';return '';}

const PROG=[{n:[60,64,67,72],b:36},{n:[59,62,67,71],b:43},{n:[57,60,64,69],b:45},{n:[57,60,65,69],b:41}];
const mtof=m=>440*Math.pow(2,(m-69)/12);
let bpm=100,playing=false,t0=0,nextBar=0,timer=null,raf=null,bus=null,NB=null,shown=-1,songMsg='';
const spb=()=>60/bpm;
function ctx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function noise(){const c=AC;if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=c.createBufferSource();s.buffer=NB;return s;}
function env(g,t,peak,a,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
function kick(t){const c=AC,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(g,t,.9,.004,.42);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.5);}
function snare(t){const c=AC,n=noise(),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=1300;env(g,t,.42,.003,.17);n.connect(f);f.connect(g);g.connect(bus);n.start(t);n.stop(t+.22);const o=c.createOscillator(),g2=c.createGain();o.type='triangle';o.frequency.value=190;env(g2,t,.22,.003,.09);o.connect(g2);g2.connect(bus);o.start(t);o.stop(t+.12);}
function hat(t,open,vol){const c=AC,n=noise(),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=7500;env(g,t,(vol||.11)*(open?1.4:1),.002,open?.26:.045);n.connect(f);f.connect(g);g.connect(bus);n.start(t);n.stop(t+.3);}
function stick(t){const c=AC,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=1700;env(g,t,.12,.002,.035);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.06);}
function crash(t){const c=AC,n=noise(),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=4500;env(g,t,.2,.005,1.4);n.connect(f);f.connect(g);g.connect(bus);n.start(t);n.stop(t+1.5);}
function bass(m,t,d){const c=AC,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=mtof(m);f.type='lowpass';f.frequency.value=520;f.Q.value=5;env(g,t,.3,.006,d);o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05);}
function pad(ch,t,d,vol){const c=AC,f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=1500;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.05,t+.25);g.gain.setValueAtTime(vol||.05,t+d-.12);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);f.connect(g);g.connect(bus);for(const m of ch)for(const det of [-7,7]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=det;o.connect(f);o.start(t);o.stop(t+d+.3);}}
function pluck(m,t){const c=AC,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='square';o.frequency.value=mtof(m);f.type='lowpass';f.frequency.value=2600;env(g,t,.055,.003,.13);o.connect(f);f.connect(g);g.connect(bus);o.start(t);o.stop(t+.18);}
function lead(m,t,d){const c=AC,g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.5;lg.gain.value=5;lfo.connect(lg);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.setValueAtTime(.15,t+d*.85);g.gain.exponentialRampToValueAtTime(.0001,t+d+.08);g.connect(bus);[['triangle',m,1],['sine',m+12,.35]].forEach(([ty,mm,v])=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=mtof(mm);lg.connect(o.frequency);og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+d+.1);});lfo.start(t);lfo.stop(t+d+.1);}
function schedBar(b,t){
  const B=BARS[b],s=spb(),T=x=>t+x*s,ch=PROG[B.rel%4];
  if(B.type==='intro'){pad(ch.n,t,4*s,.04);for(let i=0;i<8;i++)hat(T(i/2),false,.07);if(B.line.on)for(let i=0;i<4;i++)stick(T(i));return;}
  if(B.type==='outro'){if(B.first){crash(t);kick(t);pad(PROG[0].n,t,8*s,.055);bass(PROG[0].b,t,6*s);lead(84,t,2*s);}return;}
  pad(ch.n,t,4*s,B.type==='chorus'?.05:.035);
  [0,.75,1.5,2,2.75,3.5].forEach((x,i)=>bass(ch.b+(i===2||i===5?12:0),T(x),.38*s));
  if(B.rel===0)crash(t);
  if(B.type==='chorus'){[0,2,2.5].forEach(x=>kick(T(x)));[1,3].forEach(x=>snare(T(x)));for(let i=0;i<8;i++)hat(T(i/2),i===7);if(B.first&&B.line.mel)B.line.mel.forEach(([m,x,d])=>lead(m,T(x),d*s));}
  else{[0,1.75,2.5].forEach(x=>kick(T(x)));[1,3].forEach(x=>snare(T(x)));for(let i=0;i<16;i++)hat(T(i/4),false,i%2?.05:.1);const ar=[0,1,2,3,2,1,2,3];for(let i=0;i<16;i++)pluck(ch.n[ar[i%8]]+12,T(i/4));}
}
function sched(){const bd=4*spb();while(nextBar<BARS.length&&t0+nextBar*bd<AC.currentTime+.35){schedBar(nextBar,t0+nextBar*bd);nextBar++;}}
function playSong(){
  const c=ctx();if(c.resume)c.resume();
  bus=c.createGain();bus.gain.value=.85;const comp=c.createDynamicsCompressor();bus.connect(comp);comp.connect(c.destination);
  t0=c.currentTime+.15;nextBar=0;playing=true;shown=-1;songMsg='';
  sched();timer=setInterval(sched,25);renderRitim();tick();
}
function stopSong(){if(!playing)return;playing=false;clearInterval(timer);cancelAnimationFrame(raf);const b=bus;try{b.gain.setTargetAtTime(.0001,AC.currentTime,.03);setTimeout(()=>{try{b.disconnect();}catch(e){}},400);}catch(e){}if(view==='ritim')renderRitim();}
function endSong(){
  playing=false;clearInterval(timer);cancelAnimationFrame(raf);
  const today=new Date().toDateString();
  if(S.songDay!==today){S.songDay=today;S.xp+=15;bumpStreak();save();songMsg='Şarkıyı sonuna kadar söyledin! +15 XP (her gün bir kez)';confetti();}else songMsg='Harika! Bugünün XP’sini zaten aldın, yarın yine gel.';
  if(view==='ritim')renderRitim();
}
function lineHTML(l){return l.words.map((w,k)=>'<span class="w '+wordKey(w)+'" data-k="'+k+'">'+esc(w)+'</span>').join('');}
function tick(){
  if(!playing||view!=='ritim')return;
  const s=spb(),beat=(AC.currentTime-t0)/s,total=BARS.length*4;
  if(beat>=total){endSong();return;}
  if(beat>=0){
    const bar=Math.floor(beat/4),L=BARS[bar].line,li=LINES.indexOf(L);
    if(li!==shown){shown=li;document.getElementById('kSec').textContent=L.sec;document.getElementById('kCur').innerHTML=lineHTML(L);const nx=LINES[li+1];document.getElementById('kNext').textContent=nx?nx.t:'';}
    const rel=beat-L.start*4;let last=-1;
    document.querySelectorAll('#kCur .w').forEach((el,k)=>{const on=L.onsets[k]<=rel;el.classList.toggle('on',on);if(on)last=k;});
    document.querySelectorAll('#kCur .w').forEach((el,k)=>el.classList.toggle('now',k===last));
    const bi=Math.floor(beat)%4;document.querySelectorAll('#kBeats i').forEach((el,k)=>{el.classList.toggle('on',k===bi&&(beat%1)<.35);el.classList.toggle('one',k===0);});
    document.getElementById('kBar').style.width=(beat/total*100)+'%';
    const sec=Math.max(0,Math.floor((total-beat)*s));document.getElementById('kTime').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  }
  raf=requestAnimationFrame(tick);
}
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20" fill="currentColor"/></svg>';
const ICON_STOP='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
/* ---------- gerçek şarkı: Dik Üçgenin Sırrı ---------- */
const SONG_FILE='dik-ucgenin-sirri.mp3';
const INTRO_VOC=(()=>{const t='Hadi gençler! Trigonometri başlıyor, hazır mısınız? Uçuşa geçiyoruz!';return {t,sec:'GİRİŞ',type:'intro',words:t.split(' ')};})();
const SLINES=[INTRO_VOC].concat(LINES.filter(l=>l.type==='chorus'||l.type==='verse'));
// giriş: vokal analizinden (6,7 sn); diğerleri ebeveynin kulakla yaptığı eşleme (14 Ekim 2026)
const DEF_TIMES=[6.7, 11.56,13.95,16.18,17.53, 20.85,23.09,25.78,27.91, 39.26,41.47,43.95,45.87, 48.34,50.61,52.90,55.18, 58.81,60.62,62.34,64.40, 66.92,69.03,71.43,73.75];
const SKEY='trigoAvcisi.sync.v1';
// eşleme artık sabit: telefonda kalmış eski ayarlar yok sayılır
function loadSync(){try{localStorage.removeItem(SKEY);}catch(e){}return {t:null,off:0};}
let SYNC=loadSync();
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(SYNC));}catch(e){}}
const times=()=>SYNC.t||DEF_TIMES;
let rmode='song',audio=null,araf=null,sshown=-1,audioErr=false;
let songBlobUrl=null,songLoading=null;
function loadSongBlob(){
  if(songBlobUrl)return Promise.resolve(songBlobUrl);
  if(!songLoading)songLoading=fetch(SONG_FILE).then(r=>{if(!r.ok)throw new Error('http');return r.arrayBuffer();}).then(buf=>{songBlobUrl=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));return songBlobUrl;}).catch(e=>{songLoading=null;throw e;});
  return songLoading;
}
function getAudio(){
  if(audio)return audio;
  audio=new Audio();audio.preload='auto';
  audio.addEventListener('error',()=>{audioErr=true;if(view==='ritim')renderRitim();});
  audio.addEventListener('ended',()=>{cancelAnimationFrame(araf);
    // erken gelen "bitti" sinyali gerçek bitiş değildir: ödül verme, kaldığı yerden devam et
    if(audio.duration&&audio.currentTime<audio.duration-3){const t=audio.currentTime;const p=audio.play();if(p&&p.catch)p.catch(()=>{});audio.currentTime=t;songTick();return;}
    if(view==='sync'){finishSync();return;}songDone();});
  return audio;
}
function songDone(){const today=new Date().toDateString();if(S.songDay!==today){S.songDay=today;S.xp+=15;bumpStreak();save();songMsg='Şarkıyı sonuna kadar söyledin! +15 XP (her gün bir kez)';confetti();}else songMsg='Harika! Bugünün XP’sini zaten aldın, yarın yine gel.';if(view==='ritim')renderRitim();}
function audioPlaying(){return audio&&!audio.paused;}
function stopAll(){stopSong();if(audioPlaying())audio.pause();cancelAnimationFrame(araf);}
function lineAt(tm){const T=times();let cur=-1;for(let i=0;i<T.length;i++){if(T[i]==null)continue;if(T[i]+SYNC.off<=tm)cur=i;}return cur;}
function nextIdx(i){const T=times();for(let j=i+1;j<T.length;j++)if(T[j]!=null)return j;return -1;}
function songTick(){
  if(view!=='ritim'||!audioPlaying())return;
  const tm=audio.currentTime,T=times(),li=lineAt(tm);
  const cur=document.getElementById('kCur');if(!cur)return;
  if(li!==sshown){sshown=li;if(li<0){const f=nextIdx(-1);document.getElementById('kSec').textContent='GİRİŞ';cur.innerHTML='<span class="w on">Müzik başlıyor…</span>';document.getElementById('kNext').textContent=f>=0?SLINES[f].t:'';}else{const L=SLINES[li];document.getElementById('kSec').textContent=L.sec;cur.innerHTML=lineHTML(L);const n=nextIdx(li);document.getElementById('kNext').textContent=n>=0?SLINES[n].t:'';}}
  if(li>=0){const L=SLINES[li],st=T[li]+SYNC.off,n=nextIdx(li);const dur=Math.min(n>=0?T[n]-T[li]:4.6,6.5)*.86;const s=L.words.map(syl),tot=s.reduce((a,b)=>a+b,0);let acc=0;const on=s.map(x=>{const v=st+acc/tot*dur;acc+=x;return v;});let last=-1;
    document.querySelectorAll('#kCur .w').forEach((el,k)=>{const o=on[k]<=tm;el.classList.toggle('on',o);if(o)last=k;});document.querySelectorAll('#kCur .w').forEach((el,k)=>el.classList.toggle('now',k===last));}
  const bidx=Math.floor((tm-2.676)/0.577);document.querySelectorAll('#kBeats i').forEach((el,k)=>{el.classList.toggle('on',bidx>=0&&((bidx-1)%4+4)%4===k&&((tm-2.676)/0.577%1)<.35);});
  const bar=document.getElementById('kBar');if(bar&&audio.duration)bar.style.width=(tm/audio.duration*100)+'%';
  const left=Math.max(0,Math.floor((audio.duration||88)-tm));const kt=document.getElementById('kTime');if(kt)kt.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  araf=requestAnimationFrame(songTick);
}
function playRealSong(){
  if(!songBlobUrl){loadSongBlob().then(()=>{if(view==='ritim')renderRitim();}).catch(()=>{});return;}
  const a=getAudio();songMsg='';audioErr=false;
  if(a.src!==songBlobUrl)a.src=songBlobUrl;
  try{a.currentTime=0;}catch(e){}
  const p=a.play();if(p&&p.catch)p.catch(()=>{audioErr=true;renderRitim();});
  sshown=-2;renderRitim();songTick();
}

/* ---------- senkron aracı (ebeveyn için) ---------- */
let SY=null;
function startSync(){stopAll();view='sync';SY={i:0,t:new Array(SLINES.length).fill(null),started:false,done:false};renderSync();}
function renderSync(){
  setNav(false);
  const n=SLINES.length;
  if(SY.done){
    const code='TRIGO-SYNC:'+SY.t.map(x=>x==null?'-':x.toFixed(2)).join(',');
    app.innerHTML='<div class="wrap"><h2 style="font-size:28px">Senkron kaydedildi</h2><p>Bu telefonda karaoke artık senin dokunuşlarına göre akacak.</p><div class="tip">Oğlunun telefonunda da aynı olması için aşağıdaki kodu kopyalayıp Claude’a gönder. Uygulamaya kalıcı olarak işlensin.</div><textarea id="syncCode" readonly rows="5" style="width:100%;border-radius:14px;background:var(--panel);color:var(--fg);border:2px solid var(--line);padding:12px;font:14px/1.4 ui-monospace,monospace">'+code+'</textarea><div class="row"><button class="btn ghost" type="button" data-act="copySync">Kodu kopyala</button><button class="btn primary" type="button" data-act="nav" data-to="ritim">Karaokeye dön</button></div><p class="muted" id="copyMsg"></p></div>';
    return;
  }

  (SY.started?'':'<p>Şarkıyı dinle. Şarkıcı aşağıdaki satırı <b>söylemeye başladığı an</b> yeşil düğmeye dokun. Şarkıda olmayan bir satır gelirse “Bu satır yok”a bas.</p>')+
  '<section class="karaoke"><span class="sec">'+L.sec+' · '+(SY.i+1)+'/'+n+'</span><div class="cur">'+L.words.map(w=>'<span class="w on '+wordKey(w)+'">'+esc(w)+'</span>').join('')+'</div><p class="nxt">'+(nx?'Sonra: '+esc(nx.t):'Son satır')+'</p></section>'+
  (SY.started?'<button class="btn primary" type="button" data-act="syncTap" style="min-height:110px;font-size:28px">ŞİMDİ BAŞLADI</button><div class="row"><button class="btn ghost" type="button" data-act="syncSkip">Bu satır yok</button><button class="btn ghost" type="button" data-act="syncUndo"'+(SY.i?'':' disabled')+'>Geri al</button></div>':'<button class="btn primary" type="button" data-act="syncStart" style="min-height:72px">Şarkıyı başlat</button>')+'</div>';
}
function syncMark(val){SY.t[SY.i]=val;SY.i++;sfx.tap();if(SY.i>=SLINES.length)finishSync();else renderSync();}
function finishSync(){if(!SY||SY.done)return;if(audioPlaying())audio.pause();SY.done=true;if(SY.t.some(x=>x!=null)){SYNC={t:SY.t.slice(),off:0};saveSync();}renderSync();}

  '<section class="karaoke" aria-live="off"><span class="sec" id="kSec">'+(playing?'':'HAZIR')+'</span><div class="cur" id="kCur">'+(playing?'':lineHTML(LINES[2]).replace(/class="w /g,'class="w on '))+'</div><p class="nxt" id="kNext">'+(playing?'':'Oynat düğmesine bas ve 4’ten geri sayımı bekle.')+'</p><div class="beats" id="kBeats"><i class="one"></i><i></i><i></i><i></i></div></section>'+

function modeSeg(){return '<div class="seg" role="group" aria-label="Müzik"><button type="button" data-act="rmode" data-m="song" aria-pressed="'+(rmode==='song')+'">Şarkı: Dik Üçgenin Sırrı</button><button type="button" data-act="rmode" data-m="beat" aria-pressed="'+(rmode==='beat')+'">Ritim (enstrümantal)</button></div>';}
function renderSongMode(){
  setNav(true);sshown=-2;
  const ready=!!songBlobUrl;
  if(!ready)loadSongBlob().then(()=>{if(view==='ritim'&&rmode==='song')renderRitim();}).catch(()=>{audioErr=true;if(view==='ritim')renderRitim();});
  const lyr=SECTIONS.filter((s,i)=>s.type!=='intro'&&s.type!=='outro'&&SECTIONS.findIndex(x=>x.name===s.name)===i).map(s=>'<div class="lyr"><h4>'+s.name+'</h4><p>'+s.lines.map(l=>esc(l.t)).join('<br>')+'</p></div>').join('');
  const pl=audioPlaying();
  const offTxt=(SYNC.off>0?'+':'')+SYNC.off.toFixed(1).replace('.',',')+' sn';
  app.innerHTML='<div class="wrap">'+topBar()+'<h2 style="font-size:28px">Trigo Ritim</h2>'+modeSeg()+
  '<section class="karaoke" aria-live="off"><span class="sec" id="kSec">'+(pl?'':'HAZIR')+'</span><div class="cur" id="kCur">'+(pl?'':lineHTML(SLINES[0]).replace(/class="w /g,'class="w on '))+'</div><p class="nxt" id="kNext">'+(pl?'':(ready?'Oynat’a bas, şarkıyla birlikte söyle.':'Şarkı yükleniyor, birkaç saniye…'))+'</p><div class="beats" id="kBeats"><i class="one"></i><i></i><i></i><i></i></div></section>'+
  (audioErr?'<div class="exact" style="background:var(--sin)">Şarkı dosyası açılamadı. Sayfayı yenileyip tekrar dene.</div>':'')+
  (songMsg?'<div class="exact">'+songMsg+'</div>':'')+
  '<div class="player"><button type="button" class="play" data-act="songPlay" aria-label="'+(pl?'Durdur':(ready?'Oynat':'Şarkı yükleniyor'))+'"'+(ready||pl?'':' disabled style="opacity:.55"')+'>'+(pl?ICON_STOP:ICON_PLAY)+'</button><div class="info"><div class="songbar"><i id="kBar"></i></div><span class="muted" style="font-weight:700;font-variant-numeric:tabular-nums">Kalan: <span id="kTime">1:28</span></span></div></div>'+
  '<div class="tip">iPhone’da ses gelmezse yan taraftaki sessiz mod düğmesini kapat ve sesi aç.</div>'+
  '<section class="box"><h3>Sözler</h3>'+lyr+'</section></div>';
  if(pl)songTick();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const hit=e.target.closest('.hit');
  if(hit&&view==='quiz'&&!Q.lock){Q.tapped=hit.dataset.role;grade(Q.tapped===Q.list[Q.i].role);return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  if(act==='nav'){sfx.tap();go(t.dataset.to);}
  else if(act==='home'){go('home');}
  else if(act==='chapter'){startChapter(+t.dataset.id);}
  else if(act==='next'){L.i++;renderLesson();window.scrollTo({top:0});}
  else if(act==='prev'){L.i--;renderLesson();}
  else if(act==='quiz'){startQuiz(L.c);window.scrollTo({top:0});}
  else if(act==='opt'&&!Q.lock){const k=+t.dataset.i;Q.chosen=k;const q=Q.list[Q.i];grade(q.options[k]===q.answer);}
  else if(act==='nextQ'){nextQ();}
  else if(act==='retry'){startQuiz(Q.c);window.scrollTo({top:0});}
  else if(act==='sound'){S.sound=!S.sound;save();if(S.sound)sfx.tap();go(view);}
  else if(act==='play'){if(playing)stopSong();else playSong();}
  else if(act==='rmode'){stopAll();rmode=t.dataset.m;songMsg='';renderRitim();}
  else if(act==='songPlay'){if(audioPlaying()){audio.pause();cancelAnimationFrame(araf);renderRitim();}else playRealSong();}
  else if(act==='off'){SYNC.off=Math.round((SYNC.off+parseFloat(t.dataset.d))*10)/10;saveSync();const o=document.getElementById('offV');if(o)o.textContent=(SYNC.off>0?'+':'')+SYNC.off.toFixed(1).replace('.',',')+' sn';sshown=-2;}
  else if(act==='syncStart0'){startSync();}
  else if(act==='syncStart'){const a=getAudio();if(songBlobUrl&&a.src!==songBlobUrl)a.src=songBlobUrl;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});SY.started=true;renderSync();}
  else if(act==='syncTap'){syncMark(Math.max(0,audio.currentTime-0.15));}
  else if(act==='syncSkip'){syncMark(null);}
  else if(act==='syncUndo'){if(SY.i>0){SY.i--;SY.t[SY.i]=null;renderSync();}}
  else if(act==='syncExit'){if(audioPlaying())audio.pause();go('ritim');}
  else if(act==='syncReset'){SYNC={t:null,off:0};saveSync();renderRitim();}
  else if(act==='instOpen'){openInstallSheet();}
  else if(act==='instClose'){closeInstallSheet();}
  else if(act==='shareApp'){shareApp();}
  else if(act==='tipHide'){S.tipHidden=true;save();renderHome();}
  else if(act==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;closeInstallSheet();if(view==='home')renderHome();});}}
  else if(act==='copyMail'){const msg=document.getElementById('mailMsg');const ok=()=>{if(msg)msg.textContent='Adres kopyalandı.';};try{navigator.clipboard.writeText(MAIL).then(ok,()=>{if(msg)msg.textContent=MAIL+' (basılı tutup kopyalayın)';});}catch(e){if(msg)msg.textContent=MAIL+' (basılı tutup kopyalayın)';}}
  else if(act==='copySync'){const ta=document.getElementById('syncCode');const msg=document.getElementById('copyMsg');const done=()=>{msg.textContent='Kopyalandı. Şimdi Claude’a yapıştırıp gönder.';};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();msg.textContent='Kod seçildi, uzun basıp kopyala.';});}catch(e){ta.select();msg.textContent='Kod seçildi, uzun basıp kopyala.';}}
  else if(act==='tempo'){if(!playing){bpm=+t.dataset.bpm;songMsg='';renderRitim();}}
  else if(act==='setA'){const inp=document.getElementById('labAngle');inp.value=t.dataset.a;labUpdate(+t.dataset.a);}
  else if(act==='reset'){if(!resetArmed){resetArmed=true;renderSheet();}else{const n=S.name;S=def();S.name=n;save();resetArmed=false;go('home');}}
});

if(!S.name)renderWelcome();else go('home');
})();
</script>
